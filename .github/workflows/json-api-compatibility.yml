name: JSON Compatibility API

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: v21 JSON compatibility surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install --requirement requirements.txt pytest
      - name: Verify protected v21 processing code is unchanged
        run: python ci/verify_protected_processing.py
      - name: Test JSON compatibility Blueprint
        run: python -m pytest -q tests/test_v21_json_api.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Typecheck gateway
        run: npm run typecheck --workspace @airem/gateway
      - name: Build production processor image
        run: docker build -t airem-processor:json-api -f Dockerfile.python .
      - name: Start real processor
        run: docker run -d --name airem-processor-json-api -p 5000:5000 airem-processor:json-api
      - name: Wait for JSON-capable processor readiness
        run: |
          for i in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:5000/healthz | grep -q 'internal/v1'; then exit 0; fi
            sleep 2
          done
          docker logs airem-processor-json-api
          exit 1
      - name: Build valid DOCX larger than 2 MB
        run: |
          mkdir -p tmp
          cp docs/sample_1_org.docx tmp/transport-large.docx
          python - <<'PY'
          from pathlib import Path
          import os, zipfile
          path = Path('tmp/transport-large.docx')
          with zipfile.ZipFile(path, 'a', compression=zipfile.ZIP_STORED) as archive:
              archive.writestr('word/media/json-api-padding.bin', os.urandom(2_300_000))
          assert path.stat().st_size > 2 * 1024 * 1024
          PY
      - name: Run real gateway against structured Flask JSON API
        env:
          FLASK_ORIGIN: http://127.0.0.1:5000
          TRANSPORT_DOCX: tmp/transport-large.docx
        run: npx tsx services/gateway/tests/real-processor-transport.ts
      - name: Processor logs
        if: always()
        run: docker logs airem-processor-json-api || true
      - name: Stop processor
        if: always()
        run: docker rm -f airem-processor-json-api || true
