name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protected-processing:
    name: Protected Python processing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify protected source hashes
        run: python ci/verify_protected_processing.py

  python-tests:
    name: Existing Python behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: python -m pip install --requirement requirements.txt pytest
      - run: python -m pytest -q

  frontend:
    name: Frontend quality and unit tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test

  accounts:
    name: Account service and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_USER: airem,
            POSTGRES_PASSWORD: test-password,
            POSTGRES_DB: accounts_test,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airem -d accounts_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://airem:test-password@localhost:5432/accounts_test
      DATABASE_URL: postgresql://airem:test-password@localhost:5432/accounts_test
      COOKIE_SECRET: ci-cookie-secret-at-least-thirty-two-characters
    defaults: { run: { working-directory: services/accounts } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run db:migrate
      - name: Validate migrations are repeatable
        run: npm run db:migrate
      - run: npm test

  api-integration:
    name: API integration and authorization
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          {
            POSTGRES_USER: airem,
            POSTGRES_PASSWORD: test-password,
            POSTGRES_DB: gateway_test,
          }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U airem -d gateway_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://airem:test-password@localhost:5432/gateway_test
      DATABASE_URL: postgresql://airem:test-password@localhost:5432/gateway_test
      REDIS_URL: redis://localhost:6379
      COOKIE_SECRET: ci-cookie-secret-at-least-thirty-two-characters
    defaults: { run: { working-directory: services/gateway } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run db:migrate
      - name: Confirm isolated PostgreSQL and Redis are reachable
        run: |
          PGPASSWORD=test-password psql -h localhost -U airem -d gateway_test -c 'select 1'
          test "$(redis-cli -h localhost ping)" = PONG
      - run: npm test

  browser-ui:
    name: Mocked UI browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm ci
        working-directory: frontend
      - name: Run UI checks against the Playwright-managed Vite server
        run: npm run test:ui
        working-directory: e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-ui-failure
          path: |
            e2e/playwright-report
            e2e/test-results

  browser-full:
    name: Full authenticated browser workflow
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: airem-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      POSTGRES_DB: airem_e2e
      POSTGRES_PASSWORD: e2e-postgres-password
      COOKIE_SECRET: e2e-cookie-secret-at-least-thirty-two-characters
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      MAIL_FROM: e2e@example.test
      E2E_BASE_URL: https://127.0.0.1:8443
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Create ephemeral TLS certificate
        run: mkdir -p deploy/tls && openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout deploy/tls/tls.key -out deploy/tls/tls.crt
      - name: Build the isolated application stack and wait for health checks
        run: docker compose up --build --wait --wait-timeout 240
      - name: Apply migrations to the isolated database
        run: |
          docker compose exec -T accounts node services/accounts/dist/migrate.js
          docker compose exec -T gateway node services/gateway/dist/migrate.js
      - name: Require the target application to be available
        run: curl --fail --silent --show-error --insecure --retry 10 --retry-all-errors --retry-delay 2 https://127.0.0.1:8443/healthz >/dev/null
      - name: Run full authenticated workflow without API mocks
        run: npm run test:full
        working-directory: e2e
      - name: Collect container logs and remove isolated data
        if: always()
        run: |
          docker compose ps --all > compose-status.log
          docker compose logs --no-color > compose.log 2>&1
          docker compose down --volumes --remove-orphans
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: authenticated-e2e-failure
          path: |
            e2e/playwright-report
            e2e/test-results
            compose.log
            compose-status.log

  security:
    name: Dependency and image security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install and audit JavaScript production dependencies
        run: |
          npm ci --ignore-scripts --workspace airem-frontend
          npm audit --omit=dev --audit-level=high --prefix frontend
          npm ci --ignore-scripts --workspace @airem/accounts
          npm audit --omit=dev --audit-level=high --prefix services/accounts
          npm ci --ignore-scripts --workspace @airem/gateway
          npm audit --omit=dev --audit-level=high --prefix services/gateway
      - run: python -m pip install pip-audit && pip-audit -r requirements.txt
      - name: Build production images
        run: |
          docker build -t airem-processor:ci -f Dockerfile.python .
          docker build -t airem-frontend:ci -f frontend/Dockerfile .
          docker build -t airem-accounts:ci -f services/accounts/Dockerfile .
          docker build -t airem-gateway:ci -f services/gateway/Dockerfile .
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: airem-processor:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan remaining application images
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL airem-frontend:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL airem-accounts:ci
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL airem-gateway:ci

  compose-smoke:
    name: Docker Compose authenticated smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create ephemeral TLS certificate
        run: mkdir -p deploy/tls && openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=localhost -keyout deploy/tls/tls.key -out deploy/tls/tls.crt
      - name: Build and wait for every health check
        env:
          {
            POSTGRES_PASSWORD: smoke-password,
            COOKIE_SECRET: smoke-cookie-secret-at-least-thirty-two-characters,
          }
        run: docker compose up --build --wait --wait-timeout 240
      - name: Apply service migrations
        env:
          POSTGRES_PASSWORD: smoke-password
          COOKIE_SECRET: smoke-cookie-secret-at-least-thirty-two-characters
        run: |
          docker compose exec -T accounts node services/accounts/dist/migrate.js
          docker compose exec -T gateway node services/gateway/dist/migrate.js
      - name: Exercise an authenticated request
        env:
          {
            POSTGRES_PASSWORD: smoke-password,
            COOKIE_SECRET: smoke-cookie-secret-at-least-thirty-two-characters,
          }
        run: ci/compose_smoke.sh
      - if: always()
        env:
          {
            POSTGRES_PASSWORD: smoke-password,
            COOKIE_SECRET: smoke-cookie-secret-at-least-thirty-two-characters,
          }
        run: docker compose logs --no-color > compose.log && docker compose down -v
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: compose-logs, path: compose.log }
