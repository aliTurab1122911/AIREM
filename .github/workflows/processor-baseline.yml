name: Processor Baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: processor-baseline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-v21-regression:
    name: Original v21 53-test regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --requirement requirements.txt pytest
      - name: Run the unchanged v21 regression surface
        shell: bash
        run: |
          set -euo pipefail
          output="$(python -m pytest -q \
            tests/test_docx_rewriter_v14.py \
            tests/test_local_rewriter.py \
            tests/test_rewrite_optimizer.py \
            tests/test_style_score.py \
            tests/test_v15_document_studio.py \
            tests/test_v16_detection_visual_ranges.py \
            tests/test_v17_live_formatting_preview.py \
            tests/test_v18_turnitin_mapping.py \
            tests/test_v19_openai_range_edit.py \
            tests/test_v21_linguistic_rewriter.py \
            tests/test_validation_diagnostics.py)"
          printf '%s\n' "$output"
          grep -Eq '53 passed' <<<"$output"
      - name: Confirm protected processing source remains unchanged
        run: python ci/verify_protected_processing.py

  processor-container-smoke:
    name: Direct production processor smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the processor without gateway or frontend
        run: bash ci/processor_smoke.sh
