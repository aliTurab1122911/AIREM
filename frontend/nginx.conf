server {
  listen 8080;
  client_max_body_size 25m;
  location /api/ { proxy_pass http://gateway:4000; proxy_request_buffering off; proxy_buffering off; proxy_read_timeout 125s; }
  # Flask embeds these legacy paths in otherwise unchanged response payloads.
  location ~ ^/(job|preview|download|rewrite|formatting)/ { proxy_pass http://gateway:4000; proxy_request_buffering off; proxy_buffering off; proxy_read_timeout 125s; }
  location / { try_files $uri /index.html; }
}
