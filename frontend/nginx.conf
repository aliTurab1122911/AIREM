server {
  listen 8080;
  server_name _;
  return 308 https://$host:8443$request_uri;
}

# Production TLS terminates here. Mount a full chain and private key read-only;
# use an external load balancer instead only if it enforces HTTPS itself.
server {
  listen 8443 ssl;
  server_name _;
  ssl_certificate /run/tls/tls.crt;
  ssl_certificate_key /run/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  client_max_body_size 25m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/auth/ { proxy_pass http://accounts:4000/v1/auth/; include /etc/nginx/proxy_params; }
  location /api/account { proxy_pass http://accounts:4000/v1/account; include /etc/nginx/proxy_params; }
  location /api/ { proxy_pass http://gateway:4000; include /etc/nginx/proxy_params; proxy_request_buffering off; proxy_buffering off; proxy_read_timeout 125s; }
  # Flask embeds these legacy paths in otherwise unchanged response payloads.
  location ~ ^/(job|preview|download|rewrite|formatting)/ { proxy_pass http://gateway:4000; include /etc/nginx/proxy_params; proxy_request_buffering off; proxy_buffering off; proxy_read_timeout 125s; }
  location / { try_files $uri /index.html; }
}
