server {
  listen 8080;
  server_name _;
  return 308 https://$host:8443$request_uri;
}

server {
  listen 8443 ssl;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  ssl_certificate /run/tls/tls.crt;
  ssl_certificate_key /run/tls/tls.key;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  client_max_body_size 25m;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;

  location /api/auth/ { proxy_pass http://accounts:4000/v1/auth/; include /etc/nginx/proxy_params; }
  location /api/account { proxy_pass http://accounts:4000/v1/account; include /etc/nginx/proxy_params; }
  location /api/ { proxy_pass http://gateway:4000; include /etc/nginx/proxy_params; proxy_request_buffering off; proxy_buffering off; proxy_read_timeout 125s; }

  # React is the only public application surface. Legacy Flask/Jinja paths are
  # intentionally not proxied; artifact links are normalized to /api/documents/*.
  location = /index.html { try_files /index.html =404; }
  location / { try_files $uri $uri/ /index.html; }
}
