# Local-development services. Do not deploy this override in production.
services:
  accounts:
    environment:
      NODE_ENV: development
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      MAIL_FROM: no-reply@airem.local
    depends_on:
      mailpit: {condition: service_started}
  mailpit:
    image: axllent/mailpit:v1.27
    ports: ["127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"]
    expose: ["1025"]
    networks: [backend]
