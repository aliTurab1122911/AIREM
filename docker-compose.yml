services:
  frontend:
    build: ./frontend
    ports: ["8080:8080"]
    networks: [public]
    depends_on: [gateway]
  gateway:
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    environment:
      DATABASE_URL: postgresql://airem:${POSTGRES_PASSWORD:-change-me}@postgres:5432/airem
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET}
      FLASK_ORIGIN: http://processor:5000
      NODE_ENV: production
    expose: ["4000"]
    networks: [public, processor]
    depends_on: [postgres, processor]
  processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    expose: ["5000"]
    networks: [processor]
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: airem
      POSTGRES_USER: airem
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./services/accounts/migrations/0001_accounts.sql:/docker-entrypoint-initdb.d/01-accounts.sql:ro
      - ./services/gateway/migrations/0001_gateway.sql:/docker-entrypoint-initdb.d/02-gateway.sql:ro
    networks: [public]
networks:
  public: {}
  processor:
    internal: true
volumes:
  postgres-data: {}
